<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sathish AI Error</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d0d0d;
      color: #ececec;
    }
    .error-card {
      background: #1f1f1f;
      border: 1px solid #333;
      border-radius: 20px;
      padding: 40px;
      max-width: 520px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }
    .error-card h1 {
      margin-bottom: 18px;
      font-size: 36px;
      color: #ff6b6b;
    }
    .error-card p {
      margin-bottom: 28px;
      color: #bcbbbb;
      line-height: 1.6;
      font-size: 18px;
    }
    .error-card a {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 14px;
      background: #10a37f;
      color: white;
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .error-card a:hover {
      background: #0d9365;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="error-card">
    <h1>Oops!</h1>
    <p>Something went wrong while generating your Sathish AI suggestions. Please check your API key or try again in a moment.</p>
    <a href="/">Return Home</a>
  </div>
</body>
</html>
